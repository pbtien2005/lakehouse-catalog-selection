# Single-node learning environment. The Docker image skips config rewriting.
gravitino.server.webserver.host = 0.0.0.0
gravitino.server.webserver.httpPort = 8090
gravitino.server.webserver.minThreads = 8
gravitino.server.webserver.maxThreads = 64

# Embedded entity database, separate from the PostgreSQL source catalog.
gravitino.entity.store = relational
gravitino.entity.store.relational = JDBCBackend
gravitino.entity.store.relational.jdbcUrl = jdbc:h2
gravitino.entity.store.relational.jdbcDriver = org.h2.Driver
# H2 appends .mv.db: this is a database file prefix inside the mounted directory.
gravitino.entity.store.relational.storagePath = /entity-store/gravitino
gravitino.entity.store.relational.maxConnections = 10

# Disable entity cache to make this introductory observation lab easier to follow.
# Provider/connection caches still exist; this is not a distributed-consistency test.
gravitino.cache.enabled = false
gravitino.authorization.enable = false
gravitino.auxService.names =
