name: nessie-lab
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup-env.ps1 first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nessie -d nessie"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run setup-env.ps1 first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run setup-env.ps1 first}
    ports:
      - '127.0.0.1:19200:9000'
      - '127.0.0.1:19201:9001'
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for attempt in $$(seq 1 60); do
          if mc alias set lab http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; then
            mc mb --ignore-existing lab/warehouse
            exit 0
          fi
          sleep 2
        done
        echo 'MinIO did not become ready' >&2
        exit 1

  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.8
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC2
      NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE: postgresql
      QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_POSTGRESQL_USERNAME: nessie
      QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      NESSIE_SERVER_AUTHENTICATION_ENABLED: 'false'
      NESSIE_CATALOG_DEFAULT_WAREHOUSE: warehouse
      NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION: s3://warehouse/
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT: http://minio:9000
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS: 'true'
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION: us-east-1
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ACCESS_KEY: urn:nessie-secret:quarkus:lab.s3
      LAB_S3_NAME: ${MINIO_ROOT_USER}
      LAB_S3_SECRET: ${MINIO_ROOT_PASSWORD}
      JAVA_OPTS_APPEND: '-Xms128m -Xmx768m'
    ports:
      - '127.0.0.1:19120:19120'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:9000/q/health/ready']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  jars-init:
    image: alpine/curl:8.21.0
    user: root
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        base=https://repo.maven.apache.org/maven2
        for artifact in \
          org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/1.11.0/iceberg-spark-runtime-3.5_2.12-1.11.0.jar \
          org/apache/iceberg/iceberg-aws-bundle/1.11.0/iceberg-aws-bundle-1.11.0.jar \
          org/projectnessie/nessie-integrations/nessie-spark-extensions-3.5_2.12/0.108.8/nessie-spark-extensions-3.5_2.12-0.108.8.jar; do
          file=/jars/$${artifact##*/}
          if [ ! -s "$$file" ]; then
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 600 "$$base/$$artifact" -o "$$file.tmp"
            mv "$$file.tmp" "$$file"
          fi
        done
        chmod 755 /jars
        chmod 644 /jars/*.jar
    volumes:
      - spark-jars:/jars

  spark:
    image: apache/spark:3.5.7-scala2.12-java17-python3-ubuntu
    command: [/bin/bash, -c, 'sleep infinity']
    working_dir: /tmp
    environment:
      AWS_REGION: us-east-1
    depends_on:
      nessie:
        condition: service_healthy
      jars-init:
        condition: service_completed_successfully
    volumes:
      - spark-jars:/opt/lab/jars:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./scripts:/opt/lab/scripts:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://nessie:19120/api/v2/config', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  postgres-data:
  minio-data:
  spark-jars:
