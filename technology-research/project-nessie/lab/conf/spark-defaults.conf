spark.master local[2]
spark.driver.memory 1g
spark.ui.enabled false
spark.sql.shuffle.partitions 2
spark.jars /opt/lab/jars/iceberg-spark-runtime-3.5_2.12-1.11.0.jar,/opt/lab/jars/iceberg-aws-bundle-1.11.0.jar,/opt/lab/jars/nessie-spark-extensions-3.5_2.12-0.108.8.jar
spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions
spark.sql.defaultCatalog nessie
spark.sql.catalog.nessie org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nessie.type rest
spark.sql.catalog.nessie.uri http://nessie:19120/iceberg/main/
# Use the server default warehouse. Setting the warehouse name here causes
# malformed REST prefixes when USE REFERENCE runs with this extension version.
spark.sql.catalog.nessie.io-impl org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.nessie.rest.auth.type none
